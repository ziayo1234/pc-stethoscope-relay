<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6b5c">
<title>PC 청진기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --base:#eaf0ee; --surface:#ffffff; --surface-2:#f2f6f4; --stroke:#dce4e1; --stroke-strong:#c2ccc9;
  --ink:#16201d; --ink-2:#55625e; --ink-3:#7e8a86;
  --accent:#0d6b5c; --accent-press:#094d43; --accent-ink:#ffffff; --accent-soft:#d5eae4; --accent-text:#0b5f52;
  --crit:#c42b1c; --crit-bg:#fde7e9; --warn:#9d5d00; --warn-bg:#fff4ce; --ok:#0f7b0f; --ok-bg:#dff6dd; --glyph:#ffffff;
  --f:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --base:#161b1a; --surface:#262d2b; --surface-2:#2c3432; --stroke:#343e3b; --stroke-strong:#4b5653;
  --ink:#e8eeec; --ink-2:#a8b4b0; --ink-3:#83908c;
  --accent:#4dbfa8; --accent-press:#3ea793; --accent-ink:#04201b; --accent-soft:#1c3934; --accent-text:#7ad3c1;
  --crit:#ff99a4; --crit-bg:#442726; --warn:#f2c14e; --warn-bg:#433519; --ok:#6ccb5f; --ok-bg:#25391f; --glyph:#1a1a1a;
  color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--base);color:var(--ink);font:16px/24px var(--f);overscroll-behavior-y:none}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-2)}
.small{font-size:13px;line-height:18px}

/* 앱 막대 */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;min-height:56px;padding:env(safe-area-inset-top) 16px 0;background:var(--base);border-bottom:1px solid var(--stroke)}
.bar .ic{color:var(--accent);width:26px;height:26px}
.bar h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--surface-2);color:var(--ink-2);font-size:13px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.pill.on{background:var(--ok-bg);color:var(--ok)} .pill.on::before{background:var(--ok)}
.pill.off{background:var(--crit-bg);color:var(--crit)} .pill.off::before{background:var(--crit)}

main{display:grid;gap:12px;padding:12px 16px calc(88px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

/* 아래 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1fr;padding:4px 8px env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--stroke)}
.tabbar button{display:grid;justify-items:center;align-content:center;gap:2px;min-height:58px;border:0;background:none;color:var(--ink-3);font-size:12px;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--accent-text)}
.tabbar .ic{width:24px;height:24px}

/* 안 켜질 때 */
.boot{display:grid;gap:12px}
.syms{display:grid;gap:8px}
.sym{display:grid;grid-template-columns:minmax(0,1fr) 22px;align-items:center;gap:2px 12px;width:100%;padding:14px 16px;border:1px solid var(--stroke);border-radius:14px;background:var(--surface);text-align:left;word-break:keep-all}
.sym:active{background:var(--surface-2)}
.sym b{font-size:17px;line-height:24px}
.sym span{grid-column:1;color:var(--ink-2);font-size:14px;line-height:20px}
.sym .ic{grid-row:1 / span 2;grid-column:2;color:var(--ink-3)}
.bstep-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.bstep-top > b{min-width:0;word-break:keep-all}
.prog{font-size:14px;color:var(--ink-2)}
.pbar{height:4px;border-radius:2px;background:var(--stroke);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.bstep h2{font-size:20px;line-height:28px}
.bstep .how{font-size:16px;line-height:25px;word-break:keep-all}
.safe{font-size:14px;line-height:20px;color:var(--warn)}
.asks{display:flex;flex-wrap:wrap;gap:8px}
.ask{min-height:42px;padding:0 16px;border:1px solid var(--stroke-strong);border-radius:21px;background:var(--surface);font-size:15px}
.ask[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.answer{padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:15px;line-height:22px;word-break:keep-all}
.bacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkbtn{justify-self:start;border:0;background:none;padding:8px 0;color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.quote{padding:12px 14px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:var(--surface-2);font-size:16px;line-height:24px;word-break:keep-all}
.tried{margin:0;padding-left:22px;color:var(--ink-2);font-size:14px;line-height:22px}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:17px;font-weight:700}

/* 찍는 법 */
.tip{font-size:14px;line-height:20px;color:var(--ink-2);text-align:center}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:1px solid var(--stroke-strong);border-radius:12px;background:var(--surface);font-weight:600;white-space:nowrap}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{background:var(--accent-press)}
.shoot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.shoot .btn.primary{min-height:56px;font-size:17px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0}

/* 사진 */
.pgallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pgallery:empty{display:none}
.pthumb{position:relative;display:grid;gap:4px;padding:0 0 6px;border:1px solid var(--stroke);border-radius:10px;overflow:hidden;background:var(--surface);font-size:12px;line-height:16px}
.pthumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.pthumb[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pthumb .tag{justify-self:start;margin:0 6px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
.pthumb .why{padding:0 6px;color:var(--ink-2)}
.pthumb .px{position:absolute;top:4px;right:4px;width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}
.pthumb .px .ic{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12px;white-space:nowrap}
.tag.crit{background:var(--crit-bg);color:var(--crit)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--ok-bg);color:var(--ok)}
.pview{position:relative;justify-self:center;max-width:100%}
.pview img{display:block;max-width:100%;max-height:60vh;border-radius:10px}
.pboxes{position:absolute;inset:0;pointer-events:none}
.pbox{position:absolute;border:2px solid var(--crit);border-radius:3px}
.pbox.dust{border-color:var(--warn)}
.pbox span{position:absolute;left:-2px;bottom:100%;margin-bottom:2px;padding:0 5px;border-radius:3px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;white-space:nowrap}
.pbox.dust span{background:var(--warn);color:var(--glyph)}

/* 결과 */
.verdict{display:grid;gap:4px;padding:14px 16px;border-radius:12px;background:var(--surface-2)}
.verdict.ok{background:var(--ok-bg)} .verdict.warn{background:var(--warn-bg)} .verdict.crit{background:var(--crit-bg)}
.verdict .head{font-weight:700;font-size:17px}
.checks{display:grid;gap:4px}
.checks h3{font-size:14px;font-weight:700;color:var(--ink-2);margin-top:6px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:8px 0;word-break:keep-all}
.checks input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.checks .tag{margin-left:6px;vertical-align:1px}
.checks .hint{display:block;margin-top:2px;color:var(--ink-2);font-size:14px;line-height:20px}
.foot{text-align:center;font-size:13px;color:var(--ink-3)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;max-width:480px;margin:0 auto;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--base);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-steth" viewBox="0 0 24 24"><path d="M6 3v6a4.5 4.5 0 0 0 9 0V3M10.5 13.5v2a4 4 0 0 0 8 0V13"/><circle cx="18.5" cy="11" r="2"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 16l5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="9" r="1.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5.5l6.5 6.5L9 18.5"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7.2 6.6a7.5 7.5 0 1 0 9.6 0"/></symbol>
</svg>

<header class="bar">
  <svg class="ic" aria-hidden="true"><use href="#i-steth"/></svg>
  <h1 id="viewTitle">사진 진단</h1>
  <span class="pill" id="linkPill" hidden></span>
</header>

<main id="viewBoot" hidden>
  <div class="boot" id="boot"></div>
  <p class="foot">데스크톱 PC 기준</p>
</main>

<main id="viewPhoto">
  <p class="tip">본체 옆판 열기 · 전원 선 뽑기 · 밝은 곳</p>

  <div class="shoot">
    <label class="btn primary file"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg>사진 찍기<input id="shot" type="file" accept="image/*" capture="environment"></label>
    <label class="btn file" aria-label="앨범에서 고르기"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg>앨범<input id="pick" type="file" accept="image/*" multiple></label>
  </div>

  <div class="pgallery" id="pgallery"></div>
  <div class="pview" id="pview" hidden><img id="pviewImg" alt="고른 사진"><div class="pboxes" id="pboxes"></div></div>

  <section class="card" id="resultCard" hidden>
    <h2>사진 분석</h2>
    <div id="presult"></div>
  </section>

  <section class="card">
    <h2>눈으로 확인</h2>
    <div class="checks" id="checks"></div>
    <div class="verdict" id="photoBox"></div>
  </section>

  <p class="foot">사진은 이 휴대폰 안에서만 분석 · 밖으로 안 보냄</p>
</main>

<nav class="tabbar" aria-label="화면">
  <button type="button" data-go="photo" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg>사진 진단</button>
  <button type="button" data-go="boot"><svg class="ic" aria-hidden="true"><use href="#i-power"/></svg>안 켜질 때</button>
</nav>

<div class="toast" id="toast" role="status" hidden></div>

<script src="photo.js"></script>
<script src="link.js"></script>
<script src="app.js"></script>
<script src="boot.js"></script>
</body>
</html>
